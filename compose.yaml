services:
  db:
    image: postgres:17

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: starter_db

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d starter_db']
      interval: 5s
      timeout: 5s
      retries: 5
  release:
    build: .

    command: >
      sh -c "alembic upgrade head &&
            python -m scripts.seed"

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/starter_db
      JWT_SECRET_KEY: local-docker-secret-at-least-32-bytes-long

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME}

    depends_on:
      db:
        condition: service_healthy

  backend:
    build: .

    ports:
      - '8000:8000'

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/starter_db
      JWT_SECRET_KEY: local-docker-secret-at-least-32-bytes-long
      FRONTEND_ORIGIN: http://localhost:3000
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME}

    depends_on:
      release:
        condition: service_completed_successfully

volumes:
  postgres_data:
